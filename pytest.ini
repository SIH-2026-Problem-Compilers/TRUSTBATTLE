# TRUSTBATTLE — shared pytest configuration
# importlib mode lets each memberN_*/tests folder reuse common test-file
# basenames (test_features.py, test_data_loader.py, ...) without __init__.py
# files — member folders stay untouched. Proposed by M3; see AGENTS.md §4.
[pytest]
addopts = --import-mode=importlib
testpaths =
    member1_physical/tests
    member2_temporal/tests
    member3_trust/tests
    member4_cyber/tests
    backend/tests
    tests
