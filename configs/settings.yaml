# TRUSTBATTLE — Shared Configuration
# All modules read tunable values from here. Copy to configs/local.yaml for personal overrides.

project:
  name: TRUSTBATTLE
  schema_version: "1.0"

simulation:
  uav_id: uav1
  duration_s: 600
  base_frequency_hz: 10
  random_seed: 42

sensors:
  gnss:
    noise_std_m: 3.0
    update_rate_hz: 10
  imu:
    accel_noise_std: 0.05
    gyro_noise_std: 0.01
    update_rate_hz: 100
  visual:
    update_rate_hz: 5

attacks:            # used by Member 4
  gnss_spoof:
    # §7 calibration: GNSS claims ~120 km/h while the IMU supports ~55 km/h
    # → velocity divergence ≈ 18 m/s → offset reached after ramp_s:
    # 18 m/s × 30 s = 540 m (drift continues unboundedly beyond that)
    offset_start_m: 540
    ramp_s: 30
  replay:
    delay_s: 12
  network_anomaly:
    packet_delay_spike_ms: 900
    packet_loss_pct: 25

trust_engine:       # used by Member 3 (initial weights — to be experimentally tuned)
  weights:
    physical_consistency: 0.30
    temporal_consistency: 0.20
    cross_sensor_agreement: 0.25
    network_integrity: 0.15
    historical_reliability: 0.10
    # ML anomaly detectors (inverted 1 - anomaly before use). Additive evidence
    # terms: deterministic check scores and ML model scores stay separate
    # inputs, and the weighted mean renormalizes over whatever is present.
    anomaly_physical: 0.05
    anomaly_temporal: 0.05
  aggregation:        # Step 2 — multi-evidence corroboration (evidence rules only)
    degraded_threshold: 0.75   # family quality below this counts as degraded
    min_degraded: 2            # corroboration penalty applies from this many degraded families
    corroboration_penalty: 0.92  # multiplicative factor per additional degraded family
    severe_floor: 0.35         # never amplify below this (already-severe trust)
    min_attribution: 0.30      # per-sensor: only families meaningfully attributed count
    primary_min_attribution: 0.55  # a sensor's primary channel(s)
    primary_blend: 0.85        # how strongly quality blends toward the primary channel
    primary_margin: 0.10       # pull only when the primary channel is this much weaker
    primary_engage_min: 0.30   # never re-blend an already-catastrophic channel
    # Cross-sensor disagreement that is EXTREME (quality below extreme_threshold)
    # while every other deterministic family is clean is treated as unresolved
    # (most plausibly drift of a derived/dead-reckoned source) instead of
    # decisive evidence: its impact is bounded to floor_value so a lingering
    # inertial divergence cannot pin trust to the floor forever.
    cross_extreme_threshold: 0.35
    cross_uncorroborated_floor: 0.72
    cross_max_velocity_gap_mps: 8.0  # position-only divergence = drift signature
  estimator_aiding:   # trust-gated aiding of the dead-reckoned channels (aided-INS behaviour)
    enabled: true
    rate: 0.35           # fraction of the GNSS–inertial disagreement removed per window
    # Only heals large divergence (bounded drift stays <= ~26 m, conflict step
    # 35 m + drift stays <= ~61 m and is therefore NEVER healed — the conflict
    # offset must remain visible to cross-sensor agreement; genuine nav
    # malfunction divergence is unbounded and crosses this freely).
    min_disagreement_m: 80.0
    max_velocity_gap_mps: 8.0  # never aid when velocity channels disagree (spoof signature)
    velocity_leak_rate: 0.2   # per-window damping of inertial velocity toward the reported
                              # velocity while evidence is clean + velocity channels agree —
                              # bounds dead-reckoner drift (system_audit M3-open artifact)
                              # WITHOUT healing step-position offsets (conflict) or spoofed
                              # velocity (gate off: spoof velocity gap ~18 m/s > 8)
  decay:
    drop_rate: 0.75     # how fast trust falls during anomaly (fast attack onset;
                        # a 50-row attack block must reach RED inside 2 windows)
    recovery_rate: 0.25 # how fast trust recovers after anomaly
    recovery_ramp: 0.5  # extra fraction of recovery_rate per consecutive clean window
    recovery_max: 0.9   # cap on the ramped recovery rate
    clean_threshold: 0.65  # family quality above this counts as clean (drives the ramp)
  thresholds:
    green: 70
    amber: 40

fusion:
  mode: trust_aware     # normal | trust_aware
  min_sensor_weight: 0.05

experiments:        # used by all (about_project.txt §19)
  corruption_levels_pct: [0, 5, 10, 20, 30]

physical:           # Member 1 — physical & sensor analysis tunables
  historical_max_speed_mps: 22.0   # §7 example; training re-learns it from clean data
  min_course_speed_mps: 1.5        # below this speed the course-vs-heading check passes
  smoothness_window: 21            # rolling window in samples (~2 s at 10 Hz)
  severity_cap_multiplier: 4.0     # severity = 1 when residual >= limit * this factor
  threshold_percentile: 0.999      # learned check limits = this percentile of clean data
  checks:
    max_position_residual_m: 25.0
    max_velocity_residual_mps: 22.0
    max_speed_excess_mps: 0.0
    max_speed_change_gap_mps: 3.0
    max_accel_inconsistency: 0.60
    max_heading_residual_deg: 30.0
    max_course_mismatch_deg: 45.0
    max_speed_component_mismatch_mps: 3.0
    max_smoothness_deg_s: 15.0
    max_deviation_sigma: 6.0
    min_gnss_quality: 0.30
  anomaly:
    n_estimators: 200
    contamination: auto
    random_state: 42
    fpr_target: 0.01              # alert threshold calibrated on clean holdout
  ocsvm:
    nu: 0.02
    kernel: rbf

temporal:           # Member 2 — temporal & telemetry/network tunables
  anomaly:
    n_estimators: 200
    contamination: auto
    random_state: 42
    fpr_target: 0.01              # alert threshold calibrated on clean holdout
  ocsvm:
    nu: 0.02
    kernel: rbf
  threshold_percentile: 0.999     # learned check limits = this percentile of clean data
  context_rows: 150              # rows of preceding stream that streaming callers pass to
                                  # score_temporal() as `history` (CR #5) — replay re-delivers
                                  # attacks.replay.delay_s = 12 s = 121 ticks @10 Hz, so the
                                  # "seen-before" freshness evidence needs >= that much context
  checks:
    max_ts_rewind_s: 0.05         # clock rewind above this = stale/replayed stream
    max_ts_gap_s: 0.5             # sampling gap limit
    max_seq_expected_err: 2.0     # max deviation from expected next sequence number
    max_seq_back: 0.0             # backward sequence steps allowed
    max_speed_change_rate: 2.0    # per-second relative speed change
    max_dt_ratio: 3.0             # dt vs rolling median dt
  network:
    iat_spike_ms: 200.0           # inter-arrival excess (ms) above rolling median*3
    max_pkt_loss: 0.05            # packet loss fraction limit
    max_rate_drop_frac: 0.4       # packet-rate drop below rolling median
